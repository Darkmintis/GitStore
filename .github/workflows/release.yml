name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Resolve version from tag
      id: version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        # Strip any pre-release suffix and default missing parts to 0.
        MAJOR=${MAJOR%%[!0-9]*}; MAJOR=${MAJOR:-0}
        MINOR=${MINOR%%[!0-9]*}; MINOR=${MINOR:-0}
        PATCH=${PATCH%%[!0-9]*}; PATCH=${PATCH:-0}
        # Keep versionCode monotonic: 1.4.1 -> 10401
        CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
        echo "name=$VERSION" >> "$GITHUB_OUTPUT"
        echo "code=$CODE" >> "$GITHUB_OUTPUT"
        echo "Building $VERSION (versionCode $CODE)"

    - name: Decode and prepare keystore
      run: |
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > $GITHUB_WORKSPACE/gitstore-release.keystore
        echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/gitstore-release.keystore" >> $GITHUB_ENV
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      env:
        APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
    - name: Rename APK
      run: |
        cd app/build/outputs/apk/release
        if [ -f "app-release.apk" ]; then
          mv app-release.apk GitStore-${{ github.ref_name }}.apk
        else
          mv app-release-unsigned.apk GitStore-${{ github.ref_name }}.apk
        fi
      
    - name: Read release notes
      id: notes
      run: |
        if [ -f "RELEASE_NOTES.md" ]; then
          BODY=$(cat RELEASE_NOTES.md)
        else
          BODY="Release ${{ github.ref_name }}"
        fi
        CREDITS=$(python3 scripts/release_credits.py "${{ github.ref_name }}")
        {
          echo "body<<EOF"
          printf '%s\n' "$BODY"
          if [ -n "$CREDITS" ]; then
            printf '%s\n' "$CREDITS"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: app/build/outputs/apk/release/*.apk
        body: ${{ steps.notes.outputs.body }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
